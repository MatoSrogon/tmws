<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Add Computer Part - PC Part Picker</title>

    <!-- Bootstrap CSS v5.3.2 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous"
    />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <a class="nadpis" href="index.html"><h1><i class="fas fa-desktop me-2"></i>PC Part Picker</h1></a>
                    <p class="lead mb-0">Add a new computer part to the catalog</p>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card bg-dark text-light border-secondary">
                        <div class="card-body p-4">
                            <h2 class="card-title mb-4"><i class="fas fa-plus-circle me-2"></i>Add New Part</h2>
                            <form id="addPartForm">
                                <div class="mb-3">
                                    <label for="partType" class="form-label">Component Type</label>
                                    <select class="form-select bg-secondary text-light border-secondary" id="partType" required>
                                        <option value="">Select a type...</option>
                                        <option value="cpu">CPU (Processor)</option>
                                        <option value="gpu">GPU (Graphics Card)</option>
                                        <option value="motherboard">Motherboard</option>
                                        <option value="ram">RAM (Memory)</option>
                                        <option value="psu">PSU (Power Supply)</option>
                                        <option value="storage">Storage (SSD/HDD)</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="partName" class="form-label">Part Name</label>
                                    <input type="text" class="form-control bg-secondary text-light border-secondary" id="partName" placeholder="e.g., AMD Ryzen 9 7950X" required>
                                </div>

                                <div class="mb-3">
                                    <label for="partSpecs" class="form-label">Specifications</label>
                                    <textarea class="form-control bg-secondary text-light border-secondary" id="partSpecs" rows="3" placeholder="e.g., 16 cores, 32 threads, 4.5GHz base, 5.7GHz boost" required></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="partPrice" class="form-label">Price (€)</label>
                                    <input type="number" class="form-control bg-secondary text-light border-secondary" id="partPrice" placeholder="699.99" step="0.01" min="0" required>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-success btn-lg flex-grow-1">
                                        <i class="fas fa-save me-2"></i>Add Part
                                    </button>
                                    <a href="partPick.html" class="btn btn-outline-light btn-lg flex-grow-1">
                                        <i class="fas fa-arrow-left me-2"></i>Back
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer py-4 border-top border-secondary mt-5">
        <div class="container">
            <p class="mb-1">PC Part Picker &copy; 2025 - A tool for building custom computers</p>
            <p class="mb-0 small">This is a demonstration website. Product specifications are for illustrative purposes only.</p>
            <p class="mb-0 small">by Matej Srogoň</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
    <script type="module">
        import { itemList } from './data.js';

        document.getElementById('addPartForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const partType = document.getElementById('partType').value;
            const partName = document.getElementById('partName').value;
            const partSpecs = document.getElementById('partSpecs').value;
            const partPrice = parseFloat(document.getElementById('partPrice').value);

            if (!partType || !partName || !partSpecs || isNaN(partPrice)) {
                alert('Please fill in all fields');
                return;
            }

            const nextId = Math.max(...itemList[partType].map(p => p.id), 0) + 1;
            const newPart = { id: nextId, name: partName, specs: partSpecs, price: partPrice, image: 'custom.png' };

            // Merge into a customParts structure held in localStorage as plain text JSON
            let customStore = null;
            try {
                customStore = JSON.parse(localStorage.getItem('customPartsTxt')) || { customParts: { cpu: [], gpu: [], motherboard: [], ram: [], psu: [], storage: [] } };
            } catch {
                customStore = { customParts: { cpu: [], gpu: [], motherboard: [], ram: [], psu: [], storage: [] } };
            }
            customStore.customParts[partType].push(newPart);

            // Save back as text JSON
            localStorage.setItem('customPartsTxt', JSON.stringify(customStore));

            alert('Part added successfully!');
            this.reset();
            setTimeout(() => { window.location.href = 'partPick.html'; }, 500);
        });
    </script>
</body>
</html>
